<script>

const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function inl(s) { return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function md(t) {
  if (!t) return '';
  const linhas = esc(t).split('\n'); let h = '', lista = null, par = [];
  const fechaPar = () => { if (par.length) { h += '<p>' + par.map(inl).join('<br>') + '</p>'; par = []; } };
  const fechaLista = () => { if (lista) { h += `<${lista.tipo}>` + lista.itens.map(i => '<li>' + inl(i) + '</li>').join('') + `</${lista.tipo}>`; lista = null; } };
  for (const l of linhas) {
    let m;
    if ((m = l.match(/^\s*[-•]\s+(.*)$/))) { fechaPar(); if (!lista || lista.tipo !== 'ul') { fechaLista(); lista = { tipo: 'ul', itens: [] }; } lista.itens.push(m[1]); }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { fechaPar(); if (!lista || lista.tipo !== 'ol') { fechaLista(); lista = { tipo: 'ol', itens: [] }; } lista.itens.push(m[1]); }
    else if (!l.trim()) { fechaPar(); fechaLista(); }
    else { fechaLista(); par.push(l); }
  }
  fechaPar(); fechaLista(); return h;
}
function toast(msg, ms = 2600) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', ms); }
function carregando(on) { document.getElementById('carregando').style.display = on ? 'flex' : 'none'; }
function soDigitos(s) { return String(s || '').replace(/\D/g, ''); }
function fmtZap(s) { const d = soDigitos(s); if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`; if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`; return s || ''; }
function linkZap(numero, texto) { let d = soDigitos(numero); if (d.length <= 11) d = '55' + d; return `https://wa.me/${d}?text=${encodeURIComponent(texto)}`; }
function fmtData(iso, comHora = true) {
  if (!iso) return 'Data a definir';
  const d = new Date(iso);
  const dia = d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
  const dm = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const h = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }).replace(':', 'h');
  return `${dia.charAt(0).toUpperCase() + dia.slice(1)}, ${dm}` + (comHora ? ` · ${h}` : '');
}
function paraInputLocal(iso) { if (!iso) return ''; const d = new Date(iso); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function deInputLocal(v) { return v ? new Date(v).toISOString() : null; }
function duracao(min) { if (!min) return ''; const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h${m ? String(m).padStart(2, '0') : ''}` : `${m} min`; }
function cargaTxt(h) { if (h == null) return ''; const n = Number(h); const hh = Math.floor(n), mm = Math.round((n - hh) * 60); return mm ? `${hh}h${String(mm).padStart(2, '0')}` : `${hh}h`; }
function aleatorio(chars, n) { let s = ''; const a = new Uint32Array(n); crypto.getRandomValues(a); for (let i = 0; i < n; i++) s += chars[a[i] % chars.length]; return s; }
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); toast('Copiado.'); }
  catch (e) { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('Copiado.'); } catch (e2) { toast('Não foi possível copiar.'); } t.remove(); }
}
function confirma(msg) { return window.confirm(msg); }

const ERROS = [
  ['SESSAO_INVALIDA', 'Sua sessão expirou. Entre novamente.'],
  ['PIN_INCORRETO', 'PIN incorreto.'],
  ['PIN_CURTO', 'O PIN precisa ter pelo menos 4 dígitos.'],

  ['MUITAS_TENTATIVAS', 'Muitas tentativas erradas. Aguarde 15 minutos e tente de novo.'],
  ['pessoas_whatsapp_key', 'Esse WhatsApp já está cadastrado.'],
  ['matriculas_turma_id_pessoa_id_key', 'Essa pessoa já está matriculada nesta turma.'],
  ['matriculas_turma_id_pin_key', 'Esse PIN já está em uso nesta turma. Gere outro.'],
  ['turmas_codigo_key', 'Esse código de turma já existe.'],

  ['Failed to fetch', 'Sem conexão com o servidor. Verifique a internet.'],
  ['Could not find the function', 'O banco ainda não foi preparado. Rode os scripts SQL (passo 2 das instruções).']
];
async function rpc(fn, args = {}) {
  if (!sb) throw new Error('Não foi possível carregar a biblioteca do Supabase. Verifique a internet.');
  const { data, error } = await sb.rpc(fn, args);
  if (error) {
    const m = (error.message || '') + ' ' + (error.details || '') + ' ' + (error.hint || '');
    if (m.includes('SESSAO_INVALIDA')) { sairLocal(); }
    const achado = ERROS.find(([k]) => m.includes(k));
    throw new Error(achado ? achado[1] : (error.message || 'Erro inesperado.'));
  }
  return data;
}
async function tenta(fn, msgOk) {
  try { carregando(true); const r = await fn(); if (msgOk) toast(msgOk); return r; }
  catch (e) { toast(e.message, 4200); console.error(e); return undefined; }
  finally { carregando(false); }
}

/* =====================================================================
   NAVEGAÇÃO
   ===================================================================== */
let timers = [];
function limpaTimers() { timers.forEach(clearInterval); timers = []; }
function go(tela, p = {}, { substituir = false, manterForm = false } = {}) {
  if (!substituir && S.tela) S.pilha.push({ tela: S.tela, p: S.p });
  if (S.pilha.length > 40) S.pilha.shift();
  S.tela = tela; S.p = p; if (!manterForm) S.f = {};
  try { history.pushState({ n: S.pilha.length }, ''); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
function voltar() {
  const ant = S.pilha.pop();
  if (!ant) { S.tela = S.papel === 'professor' ? 'p-painel' : (S.papel === 'aluno' ? 'a-jornada' : 'login'); S.p = {}; }
  else { S.tela = ant.tela; S.p = ant.p; }
  S.f = {}; render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => { if (S.pilha.length) voltar(); });

function render() {
  limpaTimers();
  const app = document.getElementById('app');
  const fn = TELAS[S.tela] || TELAS.login;
  app.className = (S.tela === 'p-palco' || S.tela === 'certificado') ? 'largo' : '';
  app.innerHTML = fn();
  const pos = POS[S.tela]; if (pos) pos();
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a; const fn = ACOES[a];
  if (fn) { ev.preventDefault(); await fn(el, ev); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.f) { S.f[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; }
  if (el.dataset.resp) agendaResposta(el);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.f) { S.f[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; }
  if (el.dataset.ch && ACOES[el.dataset.ch]) ACOES[el.dataset.ch](el, ev);
});

function sairLocal() { ls.del('iam_sessao'); S.papel = null; S.token = null; S.P = null; S.A = null; S.pilha = []; S.tela = 'login'; S.p = {}; setTimeout(render, 0); }
async function carregaProfessor() { S.P = await rpc('prof_dados', { p_token: S.token }); indexa(); }
async function carregaAluno() { S.A = await rpc('aluno_dados', { p_token: S.token }); }

async function iniciar() {
  aplicaTema();
  const ses = ls.get('iam_sessao');
  if (ses && ses.token) {
    S.papel = ses.papel; S.token = ses.token;
    try {
      carregando(true);
      if (S.papel === 'professor') { await carregaProfessor(); S.tela = 'p-painel'; }
      else { await carregaAluno(); S.tela = 'a-jornada'; }
    } catch (e) { toast(e.message, 4000); ls.del('iam_sessao'); S.papel = null; S.token = null; S.tela = 'login'; }
    finally { carregando(false); }
  }
  if (S.tela === 'login') { S.f = { modo: 'aluno' }; checaPinProfessor(); }
  render();
}
async function checaPinProfessor() { try { S.pinExiste = await rpc('prof_pin_existe'); } catch (e) { S.pinExiste = null; } if (S.tela === 'login') render(); }

/* =====================================================================
   PROFESSOR — índices e gravação
   ===================================================================== */
const X = {}; // índices
function indexa() {
  const P = S.P; ['formatos', 'aulas', 'blocos', 'aula_blocos', 'pessoas', 'turmas', 'turma_aulas', 'matriculas', 'liberacoes', 'respostas', 'presencas', 'perguntas'].forEach(k => { P[k] = P[k] || []; X[k] = Object.fromEntries(P[k].map(r => [r.id, r])); });
}
function aulasDoFormato(fid) { return S.P.aulas.filter(a => a.formato_id === fid).sort((a, b) => a.ordem - b.ordem); }
function blocosDaAula(aid) { return S.P.aula_blocos.filter(l => l.aula_id === aid).sort((a, b) => a.ordem - b.ordem).map(l => ({ ...X.blocos[l.bloco_id], _lig: l })).filter(b => b.id); }
function ta(turmaId, aulaId) { return S.P.turma_aulas.find(t => t.turma_id === turmaId && t.aula_id === aulaId); }
function matriculasDaTurma(tid) { return S.P.matriculas.filter(m => m.turma_id === tid).map(m => ({ ...m, pessoa: X.pessoas[m.pessoa_id] || {} })).sort((a, b) => (a.pessoa.nome || '').localeCompare(b.pessoa.nome || '')); }
function respostasDaTurma(tid) { const ms = new Set(S.P.matriculas.filter(m => m.turma_id === tid).map(m => m.id)); return S.P.respostas.filter(r => ms.has(r.matricula_id)); }
function pendentes(tid) { const rs = tid ? respostasDaTurma(tid) : S.P.respostas; return rs.filter(r => r.enviada && !r.comentario); }

async function salvar(tabela, reg) {
  const r = await rpc('prof_salvar', { p_token: S.token, p_tabela: tabela, p_reg: reg });
  const lista = S.P[tabela]; const i = lista.findIndex(x => x.id === r.id);
  if (i >= 0) lista[i] = r; else lista.push(r);
  X[tabela][r.id] = r; return r;
}
async function excluir(tabela, id) {
  await rpc('prof_excluir', { p_token: S.token, p_tabela: tabela, p_id: id });
  S.P[tabela] = S.P[tabela].filter(x => x.id !== id); delete X[tabela][id];
  if (tabela === 'blocos') S.P.aula_blocos = S.P.aula_blocos.filter(l => l.bloco_id !== id);
  if (tabela === 'aulas') { S.P.aula_blocos = S.P.aula_blocos.filter(l => l.aula_id !== id); S.P.turma_aulas = S.P.turma_aulas.filter(t => t.aula_id !== id); }
  if (tabela === 'matriculas') { S.P.respostas = S.P.respostas.filter(r => r.matricula_id !== id); S.P.presencas = S.P.presencas.filter(r => r.matricula_id !== id); }
}
async function garanteTA(turmaId, aulaId) { return ta(turmaId, aulaId) || await salvar('turma_aulas', { turma_id: turmaId, aula_id: aulaId }); }

function navAluno(ativo) {

}
ACOES.aba = el => { S.pilha = []; go(el.dataset.t, {}, { substituir: true }); };
function aulaAberta(a) { return a.liberada || (a.blocos && a.blocos.length > 0); }
function respostaDe(bid) { return (S.A.respostas || []).find(r => r.bloco_id === bid); }
function kit() { if (!S.A.kit) S.A.kit = { pacto: '', perfil: '', comandos: [], plano: {} }; S.A.kit.comandos = S.A.kit.comandos || []; S.A.kit.plano = S.A.kit.plano || {}; return S.A.kit; }
function elegivel() { const as = S.A.aulas || []; return as.length > 0 && as.every(a => a.presente === true); }

function atualizaAlunoPeriodico() {
  timers.push(setInterval(async () => {
    if (document.hidden) return;
    try { const antes = JSON.stringify((S.A.aulas || []).map(a => [a.liberada, a.blocos.length, a.concluida])); await carregaAluno(); const depois = JSON.stringify((S.A.aulas || []).map(a => [a.liberada, a.blocos.length, a.concluida])); if (antes !== depois && !document.activeElement.matches('textarea,input')) { render(); toast('Novo conteúdo liberado.'); } } catch (e) {}
  }, 30000));
}

TELAS['a-jornada'] = () => {
  const A = S.A; const aulas = A.aulas || []; const conc = aulas.filter(a => a.concluida).length;

TELAS['a-aula'] = () => {
  const a = (S.A.aulas || []).find(x => x.id === S.p.id); if (!a) return TELAS['a-jornada']();
  const aba = S.p.aba || 'conteudo';
  const conteudo = a.blocos.filter(b => !['comando', 'exercicio'].includes(b.tipo));
  const comandos = a.blocos.filter(b => b.tipo === 'comando');
  const exs = a.blocos.filter(b => b.tipo === 'exercicio');
  const abas = `<nav class="abas" aria-label="Partes da aula">${[['conteudo', 'Conteúdo'], ['comandos', `Comandos (${comandos.length})`], ['exercicios', `Exercícios (${exs.length})`]].map(([k, n]) => `<button class="${aba === k ? 'ativo' : ''}" data-a="abaAula" data-v="${k}">${n}</button>`).join('')}</nav>`;
  let corpo = '';
  if (aba === 'conteudo') {
    corpo = conteudo.map(b => `<section class="card" style="gap:6px"><p class="eyebrow p0">${esc(rotTipo(b.tipo))}${b.minutos ? ' · ' + b.minutos + ' min' : ''}</p><h2 class="serif" style="font-size:19px;line-height:1.35">${esc(b.titulo)}</h2><div class="conteudo">${md(b.conteudo)}</div></section>`).join('') || '<p class="vazio">O conteúdo desta aula será liberado pelo professor.</p>';

    corpo += `<div class="card"><label class="rot" for="perg">Pergunta para o professor</label><textarea class="in" id="perg" data-f="pergunta" rows="2" placeholder="Escreva aqui. Ela aparece para o professor durante a aula.">${esc(S.f.pergunta || '')}</textarea><button class="btn peq" data-a="perguntar" style="align-self:flex-end">Enviar pergunta</button></div>`;
  } else if (aba === 'comandos') {
    corpo = comandos.map(b => cartaoComando(b)).join('') || '<p class="vazio">Nenhum comando liberado nesta aula ainda.</p>';
  } else {

/* ---------- Nova turma ---------- */
function agendaPadrao(formato, data, hora) {
  const aulas = aulasDoFormato(formato.id); if (!data) return aulas.map(() => '');
  const base = new Date(`${data}T${hora || '19:00'}`);
  const intensivo = /intensiv/i.test(formato.nome) && aulas.length === 5;
  const p = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  if (intensivo) {
    const dia2 = new Date(base); dia2.setDate(dia2.getDate() + 1);
    const hs = ['08:00', '10:45', '14:30', '17:15'];
    return [fmt(base), ...hs.map(h => { const d = new Date(dia2); const [hh, mm] = h.split(':'); d.setHours(+hh, +mm, 0, 0); return fmt(d); })];
  }
  return aulas.map((_, i) => { const d = new Date(base); d.setDate(d.getDate() + 7 * i); return fmt(d); });
}
function geraCodigo(nome) {
  const pre = (nome || 'TURMA').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z ]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !['INTENSIVO', 'REGULAR', 'TURMA', 'IGREJA'].includes(w))[0] || 'TURMA';
  let c; do { c = pre.slice(0, 6) + '-' + aleatorio('ABCDEFGHJKLMNPQRSTUVWXYZ23456789', 4); } while (S.P.turmas.some(t => t.codigo === c));
  return c;
}

  const fmt = X.formatos[f.formato]; const aulas = fmt ? aulasDoFormato(fmt.id) : [];
  if (!f.datas.length || f.datas.length !== aulas.length) f.datas = fmt ? agendaPadrao(fmt, f.data, f.hora) : [];
  return topo({ titulo: 'Nova turma' }) + `<main>
    <div class="campo"><label class="rot" for="nt">Nome da turma</label><input class="in" id="nt" data-f="nome" value="${esc(f.nome || '')}" placeholder="Ex.: Intensivo · Igreja Vidas"></div>

    <div class="grade2"><div class="campo"><label class="rot" for="dt">Data da 1ª aula</label><input class="in" type="date" id="dt" data-f="data" data-ch="recalcDatas" value="${esc(f.data || '')}"></div><div class="campo"><label class="rot" for="hr">Horário</label><input class="in" type="time" id="hr" data-f="hora" data-ch="recalcDatas" value="${esc(f.hora || '')}"></div></div>

    <div class="lista datas">${aulas.map((a, i) => `<div><label class="t14 b7" for="na${i}"><span style="color:var(--terra)">${a.ordem}.</span> ${esc(a.titulo)}</label><input class="in" type="datetime-local" id="na${i}" data-ch="dataAula" data-i="${i}" value="${esc(f.datas[i] || '')}"></div>`).join('') || '<p class="t14 mudo">Escolha um formato.</p>'}</div>
  </main><div class="rodape"><button class="btn" data-a="criarTurma">Criar turma e cadastrar alunos</button></div>`;
};

/* ---------- Modo palco ---------- */
function palcoEstado() {
  const r = X.turma_aulas[S.p.ta]; const bs = blocosDaAula(r.aula_id);
  if (!S.palco || S.palco.ta !== r.id) S.palco = { ta: r.id, i: 0, restante: (bs[0]?.minutos || 0) * 60, rodando: true, inicio: Date.now(), verConteudo: false, verPerg: false };
  return { r, bs };
}
function mmss(s) { const neg = s < 0; s = Math.abs(Math.round(s)); return (neg ? '-' : '') + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
TELAS['p-palco'] = () => {
  const { r, bs } = palcoEstado(); const a = X.aulas[r.aula_id], t = X.turmas[r.turma_id]; const pc = S.palco; const b = bs[pc.i];
  const decorrido = Math.floor((Date.now() - pc.inicio) / 60000);
  const perg = S.P.perguntas.filter(q => q.turma_id === t.id && !q.lida);
  const liberado = b && (r.liberada || S.P.liberacoes.some(l => l.turma_id === t.id && l.bloco_id === b.id));
  const prox = bs[pc.i + 1];
  if (!b) return `<div class="palco"><div class="entre"><button class="btn sec peq" data-a="voltar">Voltar</button>${botaoTema()}</div><p class="vazio" style="color:#C9D1DE">Esta aula ainda não tem blocos. Monte-os na Biblioteca.</p></div>`;
  const tot = (b.minutos || 0) * 60;
  return `<div class="palco">

      <div class="linha"><span class="versao">${CONFIG.VERSAO}</span><button class="btn sec peq" data-a="encerrarPalco">Encerrar</button></div></div>
    <div><p class="p0 t13 b8" style="letter-spacing:1px;color:#C9D1DE">BLOCO ${pc.i + 1} DE ${bs.length} · ${esc(rotTipo(b.tipo).toUpperCase())}</p><h1 class="serif" style="font-size:26px;line-height:1.25;margin-top:6px">${esc(b.titulo)}</h1></div>
    ${b.minutos ? `<div class="caixa" style="display:flex;flex-direction:column;align-items:center;gap:10px"><p class="relogio ${pc.restante < 0 ? 'estourou' : ''}" id="relogio">${mmss(pc.restante)}</p><p class="p0 t14" style="color:#C9D1DE" id="relogio-sub">${pc.restante < 0 ? 'tempo esgotado' : `restantes de ${b.minutos} minutos`}</p><div class="barra" style="width:100%"><div id="relogio-barra" style="width:${tot ? Math.min(100, Math.max(0, (1 - pc.restante / tot) * 100)) : 0}%"></div></div><div class="linha"><button class="btn sec peq" data-a="pausa">${pc.rodando ? 'Pausar' : 'Retomar'}</button><button class="btn sec peq" data-a="mais5">+5 min</button><button class="btn sec peq" data-a="zerar">Reiniciar</button></div></div>` : ''}
    ${b.nota_professor ? `<div class="caixa"><p class="p0 t13 b8" style="letter-spacing:1px;color:var(--terra-claro)">NOTA DO PROFESSOR</p><p class="p0 t16" style="line-height:1.5;margin-top:6px">${esc(b.nota_professor)}</p></div>` : ''}
    <div class="caixa"><button class="btn-link" style="color:var(--terra-claro);padding:0" data-a="verConteudo">${pc.verConteudo ? 'Esconder conteúdo do bloco' : 'Ver conteúdo do bloco'}</button>${pc.verConteudo ? `<div class="conteudo" style="color:#E6E9F0;margin-top:8px">${md(b.conteudo)}${b.comando ? `<div class="comando" style="background:var(--navy2)"><p class="txt">${esc(b.comando)}</p></div>` : ''}</div>` : ''}</div>

    <button class="caixa entre" style="border:none;color:#F7F4EE;cursor:pointer;font:inherit" data-a="verPerg"><span class="linha t15 b7">${ic('balao', 20, 'var(--terra-claro)')} Perguntas da turma</span><span class="t14 b8" style="background:var(--terra-claro);color:var(--navy3);padding:2px 10px;border-radius:10px" id="nperg">${perg.length}</span></button>

    <div class="linha" style="margin-top:auto"><button class="btn sec" style="width:56px;height:56px;padding:0" data-a="blocoAnt" aria-label="Bloco anterior" ${pc.i === 0 ? 'disabled' : ''}>${ic('voltar')}</button>
      <button class="btn" style="flex:1;min-height:56px;background:#F7F4EE;color:var(--navy3);flex-direction:column;align-items:flex-start;gap:0;text-align:left" data-a="blocoProx" ${prox ? '' : 'disabled'}><span class="t13 b8" style="color:#4A5568">${prox ? `PRÓXIMO${prox.minutos ? ' · ' + prox.minutos + ' MIN' : ''}` : 'FIM DA AULA'}</span><span class="t15 b8">${prox ? esc(prox.titulo) : 'Toque em Encerrar'}</span></button></div>
  </div>`;
};
POS['p-palco'] = () => {
  let ult = Date.now();
  timers.push(setInterval(() => {
    const pc = S.palco; const agora = Date.now(); const dt = (agora - ult) / 1000; ult = agora; if (!pc) return;

    const el = document.getElementById('relogio'); if (el) { el.textContent = mmss(pc.restante); el.classList.toggle('estourou', pc.restante < 0); }

    const br = document.getElementById('relogio-barra'); if (br && tot) br.style.width = Math.min(100, Math.max(0, (1 - pc.restante / tot) * 100)) + '%';
    const sub = document.getElementById('relogio-sub'); if (sub && b) sub.textContent = pc.restante < 0 ? 'tempo esgotado' : `restantes de ${b.minutos} minutos`;
    const dc = document.getElementById('decorrido'); if (dc) dc.textContent = duracao(Math.floor((agora - pc.inicio) / 60000)) || '0 min';
  }, 1000));
  timers.push(setInterval(async () => { try { const d = await rpc('prof_dados', { p_token: S.token }); S.P.perguntas = d.perguntas; S.P.liberacoes = d.liberacoes; indexa(); const pc = S.palco; const t = X.turma_aulas[pc.ta].turma_id; const n = S.P.perguntas.filter(q => q.turma_id === t && !q.lida).length; const el = document.getElementById('nperg'); if (el && el.textContent !== String(n)) { el.textContent = n; if (pc.verPerg) render(); else toast('Nova pergunta da turma.'); } } catch (e) {} }, 20000));

function vaiBloco(i) { const r = X.turma_aulas[S.palco.ta]; const bs = blocosDaAula(r.aula_id); if (i < 0 || i >= bs.length) return; S.palco.i = i; S.palco.restante = (bs[i].minutos || 0) * 60; S.palco.rodando = true; S.palco.verConteudo = false; render(); }

ACOES.verConteudo = () => { S.palco.verConteudo = !S.palco.verConteudo; render(); };
ACOES.verPerg = () => { S.palco.verPerg = !S.palco.verPerg; render(); };

ACOES.titEnc = el => { S.f.encontros[+el.dataset.i].titulo = el.value; };
ACOES.addAulaEnc = el => { if (!el.value) return; const e = S.f.encontros[+el.dataset.i]; if (!e.aulas.includes(el.value)) e.aulas.push(el.value); render(); };
ACOES.tiraAulaEnc = el => { const e = S.f.encontros[+el.dataset.i]; e.aulas = e.aulas.filter(x => x !== el.dataset.id); render(); };
ACOES.salvarFormato = async () => {
  const f = S.f; if (!f.nome.trim()) return toast('Dê um nome ao formato.'); if (f.encontros.some(e => !e.aulas.length)) return toast('Cada encontro precisa de pelo menos uma aula.');
  const dur = parseInt(f.dur) || 120;
  const novo = await tenta(async () => {
    const fm = await salvar('formatos', { nome: f.nome.trim(), n_encontros: f.encontros.length, duracao_min: dur, carga_horaria_h: f.encontros.length * dur / 60, ordem: S.P.formatos.length + 1 });
    for (let i = 0; i < f.encontros.length; i++) {
      const e = f.encontros[i]; const prim = X.aulas[e.aulas[0]];
      const titulo = e.titulo.trim() || e.aulas.map(id => (X.aulas[id]?.titulo || '').split(':')[0]).join(' e ');
      const a = await salvar('aulas', { formato_id: fm.id, ordem: i + 1, titulo, duracao_min: dur, objetivo: prim?.objetivo || null, devocional_ref: prim?.devocional_ref || null, link_professor: prim?.link_professor || null, link_aluno: prim?.link_aluno || null, link_slides: prim?.link_slides || null, checklist: prim?.checklist || [] });
      let k = 0; const vistos = new Set();
      for (const aid of e.aulas) for (const b of blocosDaAula(aid)) { if (vistos.has(b.id)) continue; vistos.add(b.id); await salvar('aula_blocos', { aula_id: a.id, bloco_id: b.id, ordem: ++k }); }
    }
    return fm;
  }, 'Formato criado.');
  if (novo) { S.pilha = []; go('p-biblioteca', { formato: novo.id }, { substituir: true }); }
};

/* ===================================================================== */
iniciar();
</script>
