<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="carregando"><div>Carregando…</div></div>

<script>
/* =====================================================================
   BASE
   ===================================================================== */
let sb = null;
try { sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { db: { schema: CONFIG.SCHEMA }, auth: { persistSession: false } }); } catch (e) { console.error(e); }

const S = {
  papel: null, token: null,   // sessão
  P: null,                    // dados do professor
  A: null,                    // dados do aluno
  tela: 'login', p: {},       // tela atual e parâmetros
  f: {},                      // formulário em edição
  pilha: []
};

const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function inl(s) { return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function md(t) { return t ? mdL(esc(t).split('\n')) : ''; }
function mdL(L) {
  let h = '', i = 0;
  const esp = l => /^\s*([-•]\s|\d+[.)]\s|&gt;|#{2,4}\s|\|)/.test(l);
  while (i < L.length) {
    const l = L[i]; let m;
    if (!l.trim()) { i++; continue; }
    if ((m = l.match(/^#{2,4}\s+(.*)$/))) { h += `<h4>${inl(m[1])}</h4>`; i++; continue; }
    if (/^&gt;/.test(l)) { const b = []; while (i < L.length && /^&gt;/.test(L[i])) { b.push(L[i].replace(/^&gt;\s?/, '')); i++; } h += `<blockquote>${mdL(b)}</blockquote>`; continue; }
    if (/^\|/.test(l)) {
      const rows = []; while (i < L.length && /^\|/.test(L[i])) { if (!/^\|[\s\-:|]+\|?\s*$/.test(L[i])) rows.push(L[i].trim().replace(/^\||\|$/g, '').split('|').map(c => inl(c.trim()))); i++; }
      h += `<div class="tab"><table>${rows.map((r, k) => `<tr>${r.map(c => k === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`; continue;
    }
    if ((m = l.match(/^\s*[-•]\s+(.*)$/))) { const it = []; while (i < L.length && (m = L[i].match(/^\s*[-•]\s+(.*)$/))) { it.push(m[1]); i++; } h += `<ul>${it.map(x => `<li>${inl(x)}</li>`).join('')}</ul>`; continue; }
    if ((m = l.match(/^\s*(\d+)[.)]\s+(.*)$/))) { const ini = +m[1]; const it = []; while (i < L.length && (m = L[i].match(/^\s*\d+[.)]\s+(.*)$/))) { it.push(m[1]); i++; } h += `<ol${ini !== 1 ? ` start="${ini}"` : ''}>${it.map(x => `<li>${inl(x)}</li>`).join('')}</ol>`; continue; }
    const par = []; while (i < L.length && L[i].trim() && (par.length === 0 || !esp(L[i]))) { par.push(L[i]); i++; }
    h += '<p>' + par.map(inl).join('<br>') + '</p>';
  }
  return h;
}
/* ---------- Editor de texto (sem markdown à vista) ---------- */
function editor(campo, valor, alt, rotulo) {
  return `<div class="ed"><div class="ed-barra" role="toolbar" aria-label="Formatação de ${esc(rotulo)}">
    <button type="button" data-cmd="bold" title="Negrito"><b>N</b></button>
    <button type="button" data-cmd="fala" title="Fala destacada (o que o professor diz)">❝ Fala</button>
    <button type="button" data-cmd="titulo" title="Subtítulo">Título</button>
    <button type="button" data-cmd="normal" title="Texto normal">Normal</button>
    <button type="button" data-cmd="ul" title="Lista com marcadores">• Lista</button>
    <button type="button" data-cmd="ol" title="Lista numerada">1. Lista</button>
  </div><div class="ed-area conteudo" contenteditable="true" data-ed="${campo}" aria-label="${esc(rotulo)}" data-vazio="Escreva aqui…" style="min-height:${alt}px">${md(valor)}</div></div>`;
}
document.addEventListener('mousedown', ev => {
  const bt = ev.target.closest('[data-cmd]'); if (!bt) return;
  ev.preventDefault();
  const area = bt.closest('.ed').querySelector('.ed-area'); if (document.activeElement !== area) area.focus();
  const c = bt.dataset.cmd;
  const dentro = tag => { let n = getSelection().anchorNode; while (n && n !== area) { if (n.nodeName === tag) return true; n = n.parentNode; } return false; };
  if (c === 'bold') document.execCommand('bold');
  else if (c === 'ul') document.execCommand('insertUnorderedList');
  else if (c === 'ol') document.execCommand('insertOrderedList');
  else if (c === 'titulo') document.execCommand('formatBlock', false, dentro('H4') ? 'p' : 'h4');
  else if (c === 'normal') { if (dentro('UL')) document.execCommand('insertUnorderedList'); if (dentro('OL')) document.execCommand('insertOrderedList'); document.execCommand('formatBlock', false, 'p'); if (dentro('BLOCKQUOTE')) document.execCommand('outdent'); }
  else if (c === 'fala') { if (dentro('BLOCKQUOTE')) { document.execCommand('formatBlock', false, 'p'); if (dentro('BLOCKQUOTE')) document.execCommand('outdent'); } else document.execCommand('formatBlock', false, 'blockquote'); }
  S.f[area.dataset.ed] = htmlParaMd(area);
});
document.addEventListener('paste', ev => {
  const area = ev.target.closest && ev.target.closest('.ed-area'); if (!area) return;
  ev.preventDefault(); document.execCommand('insertText', false, (ev.clipboardData || window.clipboardData).getData('text/plain'));
});
function htmlParaMd(raiz) {
  const BLOCOS = /^(P|DIV|H[1-6]|BLOCKQUOTE|UL|OL|TABLE|LI)$/;
  const inl = n => {
    if (n.nodeType === 3) return n.nodeValue.replace(/ /g, ' ');
    if (n.nodeName === 'BR') return '\n';
    const t = [...n.childNodes].map(inl).join('');
    if (/^(B|STRONG)$/.test(n.nodeName) || (n.style && /bold|[6-9]00/.test(n.style.fontWeight))) { const m = t.match(/^(\s*)([\s\S]*?)(\s*)$/); return m[2] ? `${m[1]}**${m[2]}**${m[3]}` : t; }
    return t;
  };
  const limpa = t => t.split('\n').map(l => l.replace(/[ \t]+/g, ' ').trim()).join('\n').replace(/\*\*\*\*/g, '').trim();
  const blocos = el => {
    const out = []; let solto = [];
    const fecha = () => { const t = limpa(solto.map(inl).join('')); if (t) out.push(t); solto = []; };
    for (const n of el.childNodes) {
      if (n.nodeType === 1 && BLOCOS.test(n.nodeName)) {
        fecha();
        const nm = n.nodeName;
        if (/^H[1-6]$/.test(nm)) { const t = limpa(inl(n)).replace(/^\*\*(.*)\*\*$/, '$1'); if (t) out.push('### ' + t); }
        else if (nm === 'BLOCKQUOTE') { const t = blocos(n).join('\n\n'); if (t) out.push(t.split('\n').map(l => l ? '> ' + l : '>').join('\n')); }
        else if (nm === 'UL' || nm === 'OL') { let k = parseInt(n.getAttribute('start')) || 1; const it = [...n.children].filter(x => x.nodeName === 'LI').map(li => limpa(inl(li)).replace(/\n+/g, ' ')).filter(Boolean); if (it.length) out.push(it.map(x => (nm === 'UL' ? '- ' : (k++) + '. ') + x).join('\n')); }
        else if (nm === 'TABLE') { const rows = [...n.querySelectorAll('tr')].map(tr => '| ' + [...tr.children].map(c => limpa(inl(c)).replace(/\n/g, ' ').replace(/\|/g, '/')).join(' | ') + ' |'); if (rows.length) { const nc = n.querySelector('tr').children.length; rows.splice(1, 0, '|' + ' --- |'.repeat(nc)); out.push(rows.join('\n')); } }
        else if (nm === 'DIV' && [...n.childNodes].some(c => c.nodeType === 1 && BLOCOS.test(c.nodeName))) out.push(...blocos(n));
        else { const t = limpa(inl(n)); if (t) out.push(t); }
      } else solto.push(n);
    }
    fecha(); return out;
  };
  return blocos(raiz).join('\n\n');
}
function toast(msg, ms = 2600) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', ms); }
function carregando(on) { document.getElementById('carregando').style.display = on ? 'flex' : 'none'; }
function soDigitos(s) { return String(s || '').replace(/\D/g, ''); }
function fmtZap(s) { const d = soDigitos(s); if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`; if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`; return s || ''; }
function linkZap(numero, texto) { let d = soDigitos(numero); if (d.length <= 11) d = '55' + d; return `https://wa.me/${d}?text=${encodeURIComponent(texto)}`; }
function fmtData(iso, comHora = true) {
  if (!iso) return 'Data a definir';
  const d = new Date(iso);
  const dia = d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
  const dm = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const h = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }).replace(':', 'h');
  return `${dia.charAt(0).toUpperCase() + dia.slice(1)}, ${dm}` + (comHora ? ` · ${h}` : '');
}
function paraInputLocal(iso) { if (!iso) return ''; const d = new Date(iso); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function deInputLocal(v) { return v ? new Date(v).toISOString() : null; }
function duracao(min) { if (!min) return ''; const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h${m ? String(m).padStart(2, '0') : ''}` : `${m} min`; }
function cargaTxt(h) { if (h == null) return ''; const n = Number(h); const hh = Math.floor(n), mm = Math.round((n - hh) * 60); return mm ? `${hh}h${String(mm).padStart(2, '0')}` : `${hh}h`; }
function aleatorio(chars, n) { let s = ''; const a = new Uint32Array(n); crypto.getRandomValues(a); for (let i = 0; i < n; i++) s += chars[a[i] % chars.length]; return s; }

}

async function rpc(fn, args = {}) {
  if (!sb) throw new Error('Não foi possível carregar a biblioteca do Supabase. Verifique a internet.');
  const { data, error } = await sb.rpc(fn, args);
  if (error) {
    const m = (error.message || '') + ' ' + (error.details || '') + ' ' + (error.hint || '');
    if (m.includes('SESSAO_INVALIDA')) { sairLocal(); }
    const achado = ERROS.find(([k]) => m.includes(k));
    throw new Error(achado ? achado[1] : (error.message || 'Erro inesperado.'));
  }
  return data;
}
async function tenta(fn, msgOk) {
  try { carregando(true); const r = await fn(); if (msgOk) toast(msgOk); return r; }
  catch (e) { toast(e.message, 4200); console.error(e); return undefined; }
  finally { carregando(false); }
}

let timers = [];
function limpaTimers() { timers.forEach(clearInterval); timers = []; }
function go(tela, p = {}, { substituir = false, manterForm = false } = {}) {
  if (!substituir && S.tela) S.pilha.push({ tela: S.tela, p: S.p });
  if (S.pilha.length > 40) S.pilha.shift();
  S.tela = tela; S.p = p; if (!manterForm) S.f = {};
  try { history.pushState({ n: S.pilha.length }, ''); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
function voltar() {
  const ant = S.pilha.pop();
  if (!ant) { S.tela = S.papel === 'professor' ? 'p-painel' : (S.papel === 'aluno' ? 'a-jornada' : 'login'); S.p = {}; }
  else { S.tela = ant.tela; S.p = ant.p; }
  S.f = {}; render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => { if (S.pilha.length) voltar(); });

function render() {
  limpaTimers();
  const app = document.getElementById('app');
  const fn = TELAS[S.tela] || TELAS.login;
  app.className = (S.tela === 'p-palco' || S.tela === 'certificado') ? 'largo' : '';
  app.innerHTML = fn();
  const pos = POS[S.tela]; if (pos) pos();
}

function sairLocal() { ls.del('iam_sessao'); S.papel = null; S.token = null; S.P = null; S.A = null; S.pilha = []; S.tela = 'login'; S.p = {}; setTimeout(render, 0); }

async function iniciar() {
  aplicaTema();
  const ses = ls.get('iam_sessao');
  if (ses && ses.token) {
    S.papel = ses.papel; S.token = ses.token;
    try {
      carregando(true);
      if (S.papel === 'professor') { await carregaProfessor(); S.tela = 'p-painel'; }
      else { await carregaAluno(); S.tela = 'a-jornada'; }

}

   PROFESSOR — índices e gravação
   ===================================================================== */
const X = {}; // índices
function indexa() {
  const P = S.P; ['formatos', 'aulas', 'blocos', 'aula_blocos', 'pessoas', 'turmas', 'turma_aulas', 'matriculas', 'liberacoes', 'respostas', 'presencas', 'perguntas'].forEach(k => { P[k] = P[k] || []; X[k] = Object.fromEntries(P[k].map(r => [r.id, r])); });
}
function aulasDoFormato(fid) { return S.P.aulas.filter(a => a.formato_id === fid).sort((a, b) => a.ordem - b.ordem); }
function blocosDaAula(aid) { return S.P.aula_blocos.filter(l => l.aula_id === aid).sort((a, b) => a.ordem - b.ordem).map(l => ({ ...X.blocos[l.bloco_id], _lig: l })).filter(b => b.id); }
function ta(turmaId, aulaId) { return S.P.turma_aulas.find(t => t.turma_id === turmaId && t.aula_id === aulaId); }
function matriculasDaTurma(tid) { return S.P.matriculas.filter(m => m.turma_id === tid).map(m => ({ ...m, pessoa: X.pessoas[m.pessoa_id] || {} })).sort((a, b) => (a.pessoa.nome || '').localeCompare(b.pessoa.nome || '')); }
function respostasDaTurma(tid) { const ms = new Set(S.P.matriculas.filter(m => m.turma_id === tid).map(m => m.id)); return S.P.respostas.filter(r => ms.has(r.matricula_id)); }
function pendentes(tid) { const rs = tid ? respostasDaTurma(tid) : S.P.respostas; return rs.filter(r => r.enviada && !r.comentario); }

async function salvar(tabela, reg) {
  const r = await rpc('prof_salvar', { p_token: S.token, p_tabela: tabela, p_reg: reg });
  const lista = S.P[tabela]; const i = lista.findIndex(x => x.id === r.id);
  if (i >= 0) lista[i] = r; else lista.push(r);
  X[tabela][r.id] = r; return r;
}
async function excluir(tabela, id) {
  await rpc('prof_excluir', { p_token: S.token, p_tabela: tabela, p_id: id });
  S.P[tabela] = S.P[tabela].filter(x => x.id !== id); delete X[tabela][id];
  if (tabela === 'blocos') S.P.aula_blocos = S.P.aula_blocos.filter(l => l.bloco_id !== id);
  if (tabela === 'aulas') { S.P.aula_blocos = S.P.aula_blocos.filter(l => l.aula_id !== id); S.P.turma_aulas = S.P.turma_aulas.filter(t => t.aula_id !== id); }
  if (tabela === 'matriculas') { S.P.respostas = S.P.respostas.filter(r => r.matricula_id !== id); S.P.presencas = S.P.presencas.filter(r => r.matricula_id !== id); }
}
async function garanteTA(turmaId, aulaId) { return ta(turmaId, aulaId) || await salvar('turma_aulas', { turma_id: turmaId, aula_id: aulaId }); }

TELAS['a-jornada'] = () => {
  const A = S.A; const aulas = A.aulas || []; const conc = aulas.filter(a => a.concluida).length;
  const pct = aulas.length ? Math.round(conc / aulas.length * 100) : 0;

function agendaPadrao(formato, data, hora) {
  const aulas = aulasDoFormato(formato.id); if (!data) return aulas.map(() => '');
  const base = new Date(`${data}T${hora || '19:00'}`);
  const intensivo = /intensiv/i.test(formato.nome) && aulas.length === 5;
  const p = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  if (intensivo) {
    const dia2 = new Date(base); dia2.setDate(dia2.getDate() + 1);
    const hs = ['08:00', '10:45', '14:30', '17:15'];
    return [fmt(base), ...hs.map(h => { const d = new Date(dia2); const [hh, mm] = h.split(':'); d.setHours(+hh, +mm, 0, 0); return fmt(d); })];
  }
  return aulas.map((_, i) => { const d = new Date(base); d.setDate(d.getDate() + 7 * i); return fmt(d); });
}
function geraCodigo(nome) {
  const pre = (nome || 'TURMA').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z ]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !['INTENSIVO', 'REGULAR', 'TURMA', 'IGREJA'].includes(w))[0] || 'TURMA';
  let c; do { c = pre.slice(0, 6) + '-' + aleatorio('ABCDEFGHJKLMNPQRSTUVWXYZ23456789', 4); } while (S.P.turmas.some(t => t.codigo === c));
  return c;
}

  const fmt = X.formatos[f.formato]; const aulas = fmt ? aulasDoFormato(fmt.id) : [];
  if (!f.datas.length || f.datas.length !== aulas.length) f.datas = fmt ? agendaPadrao(fmt, f.data, f.hora) : [];
  return topo({ titulo: 'Nova turma' }) + `<main>

  </main><div class="rodape"><button class="btn" data-a="criarTurma">Criar turma e cadastrar alunos</button></div>`;
};

/* ---------- Modo palco (tela de aula) ---------- */
// Passos = blocos que conduzem a aula. Comandos e exercícios sem tempo próprio ficam anexados ao passo anterior.
function ehAnexo(b) { return ['comando', 'exercicio'].includes(b.tipo) && !(b.minutos > 0); }
function passosDaAula(aid) {
  const out = [];
  for (const b of blocosDaAula(aid)) { if (ehAnexo(b) && out.length) out[out.length - 1].anexos.push(b); else out.push({ ...b, anexos: [] }); }
  return out;
}
function fonteTexto() { const v = parseInt(ls.get('iam_fonte')); return v >= 14 && v <= 30 ? v : 18; }
function palcoEstado() {
  const r = X.turma_aulas[S.p.ta]; const bs = passosDaAula(r.aula_id);
  if (!S.palco || S.palco.ta !== r.id) S.palco = { ta: r.id, i: 0, restante: (bs[0]?.minutos || 0) * 60, rodando: true, inicio: Date.now(), verAluno: false, verPerg: false, painel: null, verCmd: {} };
  return { r, bs };
}
function mmss(s) { const neg = s < 0; s = Math.abs(Math.round(s)); return (neg ? '-' : '') + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function liberadoPara(r, bid) { return r.liberada || S.P.liberacoes.some(l => l.turma_id === r.turma_id && l.bloco_id === bid); }
function botaoLiberar(r, b, peq) {
  const lib = liberadoPara(r, b.id);
  return `<button class="btn ${lib ? 'verde' : 'claro'} ${peq ? 'peq' : ''}" data-a="liberarBloco" data-id="${b.id}" ${r.liberada ? 'disabled' : ''}>${lib ? ic('check', 18, 'currentColor', 2.5) + (r.liberada ? ' Aula inteira liberada' : ' Liberado (toque para retirar)') : 'Liberar para a turma'}</button>`;
}
TELAS['p-palco'] = () => {
  const { r, bs } = palcoEstado(); const a = X.aulas[r.aula_id], t = X.turmas[r.turma_id]; const pc = S.palco; const b = bs[pc.i];
  const decorrido = Math.floor((Date.now() - pc.inicio) / 60000);
  const perg = S.P.perguntas.filter(q => q.turma_id === t.id && !q.lida);
  const prox = bs[pc.i + 1];
  if (!b) return `<div class="palco"><div class="entre"><button class="btn sec peq" data-a="voltar">Voltar</button>${botaoTema()}</div><p class="vazio" style="color:#C9D1DE">Esta aula ainda não tem blocos. Monte-os na Biblioteca.</p></div>`;
  if (pc.painel) {
    const txt = pc.painel === 'guia' ? a.guia_professor : a.anexo_professor;
    return `<div class="painel"><div><div class="entre"><p class="p0 t13 b8" style="letter-spacing:1px;color:var(--terra-claro)">${pc.painel === 'guia' ? 'GUIA DA AULA' : 'PERGUNTAS DIFÍCEIS'}</p><button class="btn claro peq" data-a="painel" data-v="">Voltar à aula</button></div>
      <div class="conteudo texto-prof" style="font-size:${fonteTexto()}px">${md(txt)}</div><button class="btn claro" data-a="painel" data-v="">Voltar à aula</button></div></div>`;
  }
  const tot = (b.minutos || 0) * 60;
  const texto = b.texto_professor
    ? md(b.texto_professor)
    : `${b.nota_professor ? `<p><b>Nota do professor:</b> ${esc(b.nota_professor)}</p>` : ''}${md(b.conteudo) || '<p style="color:#C9D1DE">Este bloco ainda não tem o texto da apostila. Cadastre-o na Biblioteca, no campo “Texto do professor”.</p>'}`;

  const ok = await tenta(async () => {
    if (S.p.id) await salvar('blocos', { id: S.p.id, ...reg });
    else { const b = await salvar('blocos', reg); if (S.p.aula) { const n = blocosDaAula(S.p.aula).length; await salvar('aula_blocos', { aula_id: S.p.aula, bloco_id: b.id, ordem: n + 1 }); } }
    return true;
  }, 'Bloco salvo.');
  if (ok) voltar();
};
ACOES.desvincular = async () => { const l = S.P.aula_blocos.find(x => x.aula_id === S.p.aula && x.bloco_id === S.p.id); if (!l || !confirma('Tirar este bloco desta aula? Ele continua na biblioteca e nas outras aulas.')) return; const ok = await tenta(() => excluir('aula_blocos', l.id).then(() => true), 'Bloco retirado da aula.'); if (ok) voltar(); };
ACOES.excluirBloco = async () => { const n = usosDoBloco(S.p.id).length; if (!confirma(`Excluir este bloco de vez?${n > 1 ? ` Ele sairá de ${n} aulas.` : ''} As respostas dos alunos a ele também serão apagadas.`)) return; const ok = await tenta(() => excluir('blocos', S.p.id).then(() => true), 'Bloco excluído.'); if (ok) voltar(); };

TELAS['p-vincular'] = () => {
  const a = X.aulas[S.p.aula]; const ja = new Set(blocosDaAula(a.id).map(b => b.id)); const q = (S.f.busca || '').toLowerCase();
  const lista = S.P.blocos.filter(b => !ja.has(b.id) && (!q || b.titulo.toLowerCase().includes(q)));
  return topo({ titulo: 'Usar bloco existente', sub: `Para: ${esc(a.titulo)}` }) + `<main>
    <label class="sr" for="bb">Buscar</label><input class="in" id="bb" data-f="busca" data-ch="rerender" placeholder="Buscar bloco pelo título" value="${esc(S.f.busca || '')}">
    ${lista.slice(0, 80).map(b => { const us = usosDoBloco(b.id); return `<button class="card" data-a="vinculaBloco" data-id="${b.id}"><p class="p0 t15 b7">${esc(b.titulo)}</p><p class="p0 t13 mudo">${esc(rotTipo(b.tipo))} · ${us.map(x => `${esc(X.formatos[x.formato_id]?.nome || '')} ${x.ordem}`).join(', ') || 'sem aula'}</p></button>`; }).join('') || '<p class="vazio">Nenhum bloco encontrado.</p>'}
  </main>`;
};
ACOES.vinculaBloco = async el => { const n = blocosDaAula(S.p.aula).length; const ok = await tenta(() => salvar('aula_blocos', { aula_id: S.p.aula, bloco_id: el.dataset.id, ordem: n + 1 }), 'Bloco acrescentado à aula.'); if (ok) voltar(); };

TELAS['p-aula-form'] = () => {
  const a = S.p.id ? X.aulas[S.p.id] : null; const f = S.f;
  if (f._ini !== (a?.id || 'nova')) { f._ini = a?.id || 'nova'; const fid = a?.formato_id || S.p.formato || S.P.formatos[0]?.id; Object.assign(f, { titulo: a?.titulo || '', formato: fid, ordem: a?.ordem ?? (aulasDoFormato(fid).length + 1), duracao: a?.duracao_min ?? X.formatos[fid]?.duracao_min ?? 120, objetivo: a?.objetivo || '', devocional: a?.devocional_ref || '', lp: a?.link_professor || '', la: a?.link_aluno || '', ls: a?.link_slides || '', checklist: (a?.checklist || []).join('\n'), guia: a?.guia_professor || '', anexo: a?.anexo_professor || '' }); }
  return topo({ titulo: a ? 'Editar aula' : 'Nova aula' }) + `<main>
    <div class="campo"><label class="rot" for="at">Título da aula</label><input class="in" id="at" data-f="titulo" value="${esc(f.titulo)}"></div>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px"><div class="campo"><label class="rot" for="af">Formato</label><select class="in" id="af" data-f="formato" ${a ? 'disabled' : ''}>${S.P.formatos.map(x => `<option value="${x.id}" ${x.id === f.formato ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></div><div class="campo"><label class="rot" for="ao">Nº</label><input class="in" id="ao" type="number" min="1" data-f="ordem" value="${esc(f.ordem)}"></div><div class="campo"><label class="rot" for="ad">Min</label><input class="in" id="ad" type="number" min="0" data-f="duracao" value="${esc(f.duracao)}"></div></div>
    <div class="campo"><label class="rot" for="ab">Objetivo da aula</label><textarea class="in" id="ab" rows="2" data-f="objetivo">${esc(f.objetivo)}</textarea></div>
    <div class="campo"><label class="rot" for="av">Texto do devocional</label><input class="in" id="av" data-f="devocional" value="${esc(f.devocional)}" placeholder="Referência bíblica"></div>
    <p class="rot p0">Materiais da aula (cole os links)</p>
    <div class="campo"><label class="t14" for="l1">Apostila do professor</label><input class="in" id="l1" type="url" data-f="lp" value="${esc(f.lp)}" placeholder="https://"></div>
    <div class="campo"><label class="t14" for="l2">Apostila do aluno</label><input class="in" id="l2" type="url" data-f="la" value="${esc(f.la)}" placeholder="https://"></div>
    <div class="campo"><label class="t14" for="l3">Apresentação (slides ou PDF)</label><input class="in" id="l3" type="url" data-f="ls" value="${esc(f.ls)}" placeholder="https://"></div>
    <div class="campo"><label class="rot" for="ac">Lista de preparo <span class="mudo" style="font-weight:400">(um item por linha)</span></label><textarea class="in" id="ac" rows="4" data-f="checklist">${esc(f.checklist)}</textarea></div>
    <div class="campo"><p class="rot">Guia da aula <span class="mudo" style="font-weight:400">(como usar, visão geral, materiais e preparação)</span></p>${editor('guia', f.guia, 220, 'Guia da aula')}</div>
    <div class="campo"><p class="rot">Perguntas difíceis <span class="mudo" style="font-weight:400">(anexo da apostila)</span></p>${editor('anexo', f.anexo, 220, 'Perguntas difíceis')}</div>
  </main><div class="rodape"><button class="btn" data-a="salvarAula">${a ? 'Salvar' : 'Salvar e montar os blocos'}</button></div>`;
};
ACOES.salvarAula = async () => {
  const f = S.f; if (!f.titulo.trim()) return toast('Dê um título à aula.');
  const reg = { titulo: f.titulo.trim(), ordem: parseInt(f.ordem) || 1, duracao_min: parseInt(f.duracao) || null, objetivo: f.objetivo || null, devocional_ref: f.devocional || null, link_professor: f.lp || null, link_aluno: f.la || null, link_slides: f.ls || null, checklist: (f.checklist || '').split('\n').map(x => x.trim()).filter(Boolean), guia_professor: f.guia || null, anexo_professor: f.anexo || null };
  const a = await tenta(() => S.p.id ? salvar('aulas', { id: S.p.id, ...reg }) : salvar('aulas', { formato_id: f.formato, ...reg }), 'Aula salva.');
  if (!a) return;
  if (S.p.id) voltar(); else go('p-bib-aula', { id: a.id }, { substituir: true });
};

TELAS['p-formato-dados'] = () => {
  const x = X.formatos[S.p.id]; const f = S.f; if (f._ini !== x.id) { f._ini = x.id; Object.assign(f, { nome: x.nome, descricao: x.descricao || '', dur: x.duracao_min || '', carga: x.carga_horaria_h ?? '' }); }
  return topo({ titulo: 'Dados do formato' }) + `<main>
    <div class="campo"><label class="rot" for="fn">Nome</label><input class="in" id="fn" data-f="nome" value="${esc(f.nome)}"></div>
    <div class="campo"><label class="rot" for="fd">Descrição</label><input class="in" id="fd" data-f="descricao" value="${esc(f.descricao)}"></div>
    <div class="grade2"><div class="campo"><label class="rot" for="fu">Duração de cada aula (min)</label><input class="in" id="fu" type="number" data-f="dur" value="${esc(f.dur)}"></div><div class="campo"><label class="rot" for="fc">Carga horária (horas)</label><input class="in" id="fc" type="number" step="0.5" data-f="carga" value="${esc(f.carga)}"></div></div>
  </main><div class="rodape"><button class="btn" data-a="salvarFormatoDados">Salvar</button></div>`;
};
ACOES.salvarFormatoDados = async () => { const f = S.f; const ok = await tenta(() => salvar('formatos', { id: S.p.id, nome: f.nome.trim(), descricao: f.descricao || null, duracao_min: parseInt(f.dur) || null, carga_horaria_h: parseFloat(f.carga) || null, n_encontros: aulasDoFormato(S.p.id).length }), 'Formato salvo.'); if (ok) voltar(); };

TELAS['p-formato-form'] = () => {
  const f = S.f; if (!f._ini) { f._ini = 1; f.nome = ''; f.dur = 180; f.encontros = [{ titulo: '', aulas: [] }]; }
  const todas = S.P.formatos.flatMap(x => aulasDoFormato(x.id).map(a => ({ ...a, fnome: x.nome })));
  const usadas = new Set(f.encontros.flatMap(e => e.aulas));
  const base = S.P.formatos[0]; const faltam = base ? aulasDoFormato(base.id).filter(a => !usadas.has(a.id)) : [];
  const carga = f.encontros.length * (parseInt(f.dur) || 0) / 60;
  return topo({ titulo: 'Novo formato', sub: 'Monte encontros juntando aulas que já existem' }) + `<main>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px"><div class="campo"><label class="rot" for="fn">Nome do formato</label><input class="in" id="fn" data-f="nome" value="${esc(f.nome)}" placeholder="Ex.: Três noites"></div><div class="campo"><label class="rot" for="fdu">Min/encontro</label><input class="in" id="fdu" type="number" data-f="dur" data-ch="rerender" value="${esc(f.dur)}"></div></div>
    ${f.encontros.map((e, i) => `<div class="card" style="gap:10px"><div class="entre"><p class="p0 t15 b8">Encontro ${i + 1}</p>${f.encontros.length > 1 ? `<button class="btn-link" data-a="tiraEnc" data-i="${i}">Remover</button>` : ''}</div>
      <label class="sr" for="et${i}">Título do encontro</label><input class="in" id="et${i}" data-ch="titEnc" data-i="${i}" value="${esc(e.titulo)}" placeholder="Título do encontro (opcional)">
      <div class="chips">${e.aulas.map(aid => { const a = X.aulas[aid]; return `<button class="chip ativo" data-a="tiraAulaEnc" data-i="${i}" data-id="${aid}" aria-label="Tirar ${esc(a?.titulo)}">${esc(X.formatos[a?.formato_id]?.nome || '')} ${a?.ordem} · ${esc((a?.titulo || '').split(':')[0])} ✕</button>`; }).join('')}</div>
      <label class="sr" for="es${i}">Acrescentar aula</label><select class="in" id="es${i}" data-ch="addAulaEnc" data-i="${i}"><option value="">+ Acrescentar aula…</option>${todas.map(a => `<option value="${a.id}">${esc(a.fnome)} ${a.ordem} · ${esc(a.titulo)}</option>`).join('')}</select></div>`).join('')}
    <button class="btn sec" data-a="addEnc">+ Encontro</button>
    <div class="aviso" style="flex-direction:column;gap:4px">${base && faltam.length ? `<b>Ficam de fora do ${esc(base.nome)}: aulas ${faltam.map(a => a.ordem).join(', ')}</b>` : ''}<span>Carga horária: ${f.encontros.length} encontro${f.encontros.length > 1 ? 's' : ''} × ${duracao(parseInt(f.dur) || 0)} = ${cargaTxt(carga)} no certificado</span></div>
  </main><div class="rodape"><button class="btn" data-a="salvarFormato">Salvar formato</button></div>`;
};
ACOES.addEnc = () => { S.f.encontros.push({ titulo: '', aulas: [] }); render(); };
ACOES.tiraEnc = el => { S.f.encontros.splice(+el.dataset.i, 1); render(); };
ACOES.titEnc = el => { S.f.encontros[+el.dataset.i].titulo = el.value; };
ACOES.addAulaEnc = el => { if (!el.value) return; const e = S.f.encontros[+el.dataset.i]; if (!e.aulas.includes(el.value)) e.aulas.push(el.value); render(); };
ACOES.tiraAulaEnc = el => { const e = S.f.encontros[+el.dataset.i]; e.aulas = e.aulas.filter(x => x !== el.dataset.id); render(); };
ACOES.salvarFormato = async () => {
  const f = S.f; if (!f.nome.trim()) return toast('Dê um nome ao formato.'); if (f.encontros.some(e => !e.aulas.length)) return toast('Cada encontro precisa de pelo menos uma aula.');
  const dur = parseInt(f.dur) || 120;
  const novo = await tenta(async () => {
    const fm = await salvar('formatos', { nome: f.nome.trim(), n_encontros: f.encontros.length, duracao_min: dur, carga_horaria_h: f.encontros.length * dur / 60, ordem: S.P.formatos.length + 1 });
    for (let i = 0; i < f.encontros.length; i++) {
      const e = f.encontros[i]; const prim = X.aulas[e.aulas[0]];
      const titulo = e.titulo.trim() || e.aulas.map(id => (X.aulas[id]?.titulo || '').split(':')[0]).join(' e ');
      const a = await salvar('aulas', { formato_id: fm.id, ordem: i + 1, titulo, duracao_min: dur, objetivo: prim?.objetivo || null, devocional_ref: prim?.devocional_ref || null, link_professor: prim?.link_professor || null, link_aluno: prim?.link_aluno || null, link_slides: prim?.link_slides || null, checklist: prim?.checklist || [] });
      let k = 0; const vistos = new Set();
      for (const aid of e.aulas) for (const b of blocosDaAula(aid)) { if (vistos.has(b.id)) continue; vistos.add(b.id); await salvar('aula_blocos', { aula_id: a.id, bloco_id: b.id, ordem: ++k }); }
    }
    return fm;
  }, 'Formato criado.');
  if (novo) { S.pilha = []; go('p-biblioteca', { formato: novo.id }, { substituir: true }); }
};

/* ===================================================================== */
iniciar();
</script>
</body>
</html>
